<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" fill="none">
  <defs>
    <linearGradient id="shieldBorderWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffca28"/>
      <stop offset="50%" style="stop-color:#ffb300"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
    <linearGradient id="textGradWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#ffb300"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
    <linearGradient id="pinGradWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffca28"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
  </defs>

  <!-- Shield Background -->
  <path d="M200 20 L360 80 L360 220 C360 320 280 380 200 420 C120 380 40 320 40 220 L40 80 Z"
        fill="#1a1205" stroke="url(#shieldBorderWarm)" stroke-width="4"/>

  <!-- Inner Shield Glow -->
  <path d="M200 35 L345 90 L345 218 C345 310 270 365 200 405 C130 365 55 310 55 218 L55 90 Z"
        fill="none" stroke="url(#shieldBorderWarm)" stroke-width="1" opacity="0.3"/>

  <!-- City Skyline -->
  <g opacity="0.4">
    <rect x="250" y="180" width="18" height="60" fill="#4a3a1a" rx="1"/>
    <rect x="272" y="160" width="14" height="80" fill="#4a3a1a" rx="1"/>
    <rect x="290" y="190" width="20" height="50" fill="#4a3a1a" rx="1"/>
    <rect x="314" y="170" width="12" height="70" fill="#4a3a1a" rx="1"/>
    <rect x="240" y="200" width="10" height="40" fill="#4a3a1a" rx="1"/>
    <!-- Windows -->
    <rect x="254" y="190" width="3" height="3" fill="#ffb300" opacity="0.6"/>
    <rect x="260" y="200" width="3" height="3" fill="#ffb300" opacity="0.4"/>
    <rect x="276" y="175" width="3" height="3" fill="#ffb300" opacity="0.5"/>
    <rect x="282" y="190" width="3" height="3" fill="#ffb300" opacity="0.3"/>
    <rect x="296" y="205" width="3" height="3" fill="#ffb300" opacity="0.6"/>
    <rect x="306" y="195" width="3" height="3" fill="#ffb300" opacity="0.4"/>
  </g>

  <!-- Road -->
  <path d="M140 350 C160 320 180 290 200 270 C220 250 240 230 260 210"
        stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M145 348 C165 318 185 288 205 268 C225 248 245 228 265 208"
        stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3" stroke-dasharray="8 12"/>

  <!-- Location Pin -->
  <g transform="translate(200, 160)">
    <!-- Pin Body -->
    <path d="M0 -55 C-30 -55 -50 -35 -50 -10 C-50 25 0 65 0 65 C0 65 50 25 50 -10 C50 -35 30 -55 0 -55 Z"
          fill="url(#pinGradWarm)" opacity="0.9"/>
    <!-- Pin Inner Circle -->
    <circle cx="0" cy="-12" r="22" fill="#1a1205"/>
    <!-- Person Icon -->
    <circle cx="0" cy="-20" r="8" fill="white"/>
    <path d="M-14 -2 C-14 -10 -8 -16 0 -16 C8 -16 14 -10 14 -2 C14 4 8 10 0 10 C-8 10 -14 4 -14 -2 Z"
          fill="white" opacity="0.9"/>
  </g>

  <!-- SAFEGRID Text -->
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="url(#textGradWarm)" letter-spacing="4">SAFEGRID</text>

  <!-- Tagline -->
  <line x1="80" y1="510" x2="150" y2="510" stroke="#ffb300" stroke-width="1" opacity="0.5"/>
  <text x="200" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="11" fill="#9ca3af" letter-spacing="6">SAFER PEOPLE  STRONGER TOMORROW</text>
  <line x1="250" y1="510" x2="320" y2="510" stroke="#ffb300" stroke-width="1" opacity="0.5"/>
</svg>
